name: Update Google Scholar stats

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Scholar data
        id: fetch
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'jLLrtFQAAAAJ' }}
        run: python google_scholar_crawler/main.py

      - name: Stage the latest successful snapshot
        if: steps.fetch.outcome == 'success'
        run: cp google_scholar_crawler/results/scholar.json src/data/scholar.json

      - name: Commit the snapshot
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar.json
          git diff --cached --quiet || (git commit -m "Update Google Scholar stats" && git push)

